<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>KADYSEED — Editor de Fotos Pro</title>
<style>
:root{--bg:#f2f2f6;--panel:#fff;--ink:#16161d;--mut:#6d6d7d;--line:#e2e2ea;--stage:#e7e7ee;--chip:#efeff5;--acc:#16a34a;--acc2:#0d9488;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0c0d12;--panel:#15161d;--ink:#f1f1f6;--mut:#8b8b9c;--line:#262733;--stage:#0a0a0e;--chip:#1f2029}}
:root[data-theme="dark"]{--bg:#0c0d12;--panel:#15161d;--ink:#f1f1f6;--mut:#8b8b9c;--line:#262733;--stage:#0a0a0e;--chip:#1f2029}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column;overflow:hidden}
header{display:flex;align-items:center;gap:8px;padding:10px 12px;background:var(--panel);border-bottom:1px solid var(--line)}
.logo{margin-right:auto;line-height:1.15}.logo span{font-weight:800;font-size:17px;letter-spacing:-.3px;background:linear-gradient(90deg,var(--acc),var(--acc2));-webkit-background-clip:text;background-clip:text;color:transparent}.logo small{display:block;font-size:10px;color:var(--mut);letter-spacing:.2px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:#16161d;color:#fff;padding:11px 18px;border-radius:24px;font-weight:600;opacity:0;pointer-events:none;transition:.25s;z-index:20;max-width:90%;text-align:center}.toast.on{opacity:1;transform:translate(-50%,0)}.credit{text-align:center;color:var(--mut);font-size:11px;margin-top:18px}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
.ib{border:1px solid var(--line);background:var(--chip);border-radius:10px;min-width:38px;height:38px;padding:0 10px;font-size:16px}
.ib:disabled{opacity:.35}
.pri{border:0;color:#fff;background:linear-gradient(90deg,var(--acc),var(--acc2));font-weight:700;border-radius:10px;height:38px;padding:0 16px}
main{flex:1;min-height:0;display:flex;flex-direction:column}
.stage{flex:1;min-height:0;position:relative;background:var(--stage);display:flex;align-items:center;justify-content:center;padding:10px}
#cv{width:100%;height:100%;object-fit:contain;display:none;filter:drop-shadow(0 8px 30px rgba(0,0,0,.35))}
#hist{position:absolute;right:14px;top:14px;width:110px;height:48px;border-radius:8px;background:rgba(0,0,0,.45);display:none;backdrop-filter:blur(6px)}
#cmp{position:absolute;left:14px;bottom:14px;display:none;border:0;background:rgba(0,0,0,.6);color:#fff;border-radius:20px;padding:8px 14px;font-size:12px;font-weight:600;user-select:none;touch-action:none}
.empty{text-align:center;max-width:320px;border:2px dashed var(--line);border-radius:20px;padding:32px 20px}
.empty h2{margin:0 0 6px;font-size:20px}.empty p{color:var(--mut);margin:0 0 18px}
.empty .ib{margin-top:8px}
.panel{background:var(--panel);border-top:1px solid var(--line)}
.tabs{display:flex;gap:4px;overflow-x:auto;padding:8px 10px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;border:0;background:transparent;color:var(--mut);padding:8px 14px;border-radius:20px;font-weight:600}
.tab.on{background:linear-gradient(90deg,var(--acc),var(--acc2));color:#fff}
.body{max-height:34vh;overflow-y:auto;padding:4px 16px 16px}
.pg{display:none}.pg.on{display:block}
.row{margin:10px 0}
.row label{display:flex;justify-content:space-between;color:var(--mut);font-size:12px;font-weight:600;margin-bottom:2px}
.row output{color:var(--ink);font-variant-numeric:tabular-nums}
input[type=range]{width:100%;accent-color:var(--acc);height:28px}
input[type=text],select{width:100%;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--chip);color:var(--ink);padding:0 12px;font:inherit}
input[type=color]{width:100%;height:40px;border:1px solid var(--line);border-radius:10px;background:var(--chip);padding:3px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.chip{border:1px solid var(--line);background:var(--chip);border-radius:10px;padding:9px 13px;font-weight:600}
.chip.on{border-color:var(--acc);color:var(--acc)}
.flt{display:flex;flex-wrap:wrap;gap:12px 10px;padding:8px 0}
.flt button{flex:none;width:74px;border:0;background:none;color:var(--mut);font-size:11px;font-weight:600;text-align:center;padding:0}
.flt canvas{display:block;width:74px;height:74px;border-radius:12px;margin-bottom:4px;border:2px solid transparent}
.flt button.on canvas{border-color:var(--acc)}.flt button.on{color:var(--ink)}
.modal{position:fixed;inset:0;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.8);display:none;align-items:center;justify-content:center;flex-direction:column;gap:14px;padding:20px;z-index:9;text-align:center;color:#fff}
.modal.on{display:flex}.modal img{max-width:100%;max-height:62vh;border-radius:12px}
.modal a{text-decoration:none;display:inline-flex;align-items:center}
body{background:radial-gradient(800px 420px at 90% -8%,color-mix(in srgb,var(--acc) 22%,transparent),transparent),radial-gradient(600px 400px at -10% 110%,color-mix(in srgb,var(--acc2) 16%,transparent),transparent),var(--bg)}
header{background:color-mix(in srgb,var(--panel) 80%,transparent);backdrop-filter:blur(14px);position:relative;z-index:3}
.panel{background:color-mix(in srgb,var(--panel) 92%,transparent);backdrop-filter:blur(14px)}
.stage{touch-action:none;background:radial-gradient(circle at 50% 40%,color-mix(in srgb,var(--stage) 85%,var(--acc) 15%),var(--stage))}
.pri{box-shadow:0 6px 18px color-mix(in srgb,var(--acc) 40%,transparent);transition:transform .1s}.pri:active,.ib:active,.chip:active{transform:scale(.96)}
.logo{display:flex;align-items:center;gap:9px}.logo span{display:block}.lg{width:36px;height:36px;border-radius:10px;object-fit:cover}
.tab{min-width:0;font-size:13px;padding:9px 16px;border-radius:18px;white-space:nowrap}
input[type=range]{-webkit-appearance:none;appearance:none;background:transparent;height:26px}
input[type=range]::-webkit-slider-runnable-track{height:5px;border-radius:5px;background:var(--line)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;border-radius:50%;margin-top:-7.5px;background:#fff;border:3px solid var(--acc);box-shadow:0 2px 8px rgba(0,0,0,.35)}
input[type=range]::-moz-range-track{height:5px;border-radius:5px;background:var(--line)}
input[type=range]::-moz-range-thumb{width:14px;height:14px;border-radius:50%;background:#fff;border:3px solid var(--acc)}
.zoom{position:absolute;right:14px;bottom:14px;display:none;gap:6px}.zoom button{border:0;background:rgba(0,0,0,.6);color:#fff;border-radius:18px;min-width:38px;height:36px;font-weight:700;padding:0 10px}
#cv{transform-origin:center;will-change:transform}
@media (min-width:900px){
 main{flex-direction:row}
 .panel{width:360px;border-top:0;border-left:1px solid var(--line);display:flex;flex-direction:column;order:2}
 .tabs{flex-wrap:wrap;overflow:visible}.body{max-height:none;flex:1}
 .stage{padding:24px}
}
</style>
</head>
<body>
<header>
 <div class="logo"><img class="lg" alt=""><div><span>KADYSEED</span><small>desenvolvido por Josimar</small></div></div>
 <button class="ib" id="undo" title="Desfazer" disabled>↶</button>
 <button class="ib" id="redo" title="Refazer" disabled>↷</button>
 <button class="ib" id="reset" title="Restaurar tudo" disabled>⟲</button>
 <button class="ib" id="open" title="Abrir foto">＋</button>
 <button class="pri" id="expTop">Salvar</button>
</header>
<main>
 <div class="stage" id="stage">
  <div class="empty" id="empty">
   <img class="lg" alt="" style="width:88px;height:88px;border-radius:22px;margin-bottom:14px;box-shadow:0 10px 30px rgba(22,163,74,.4)"><h2>Edite como um profissional</h2>
   <p>Arraste uma foto aqui ou escolha da galeria. Tudo é processado no seu aparelho.</p>
   <button class="pri" id="open2">Abrir foto</button><br>
   <button class="ib" id="demo">Usar foto de exemplo</button>
   <p class="credit">desenvolvido por Josimar</p>
  </div>
  <canvas id="cv"></canvas><canvas id="hist" width="110" height="48"></canvas>
  <button id="cmp">Segure para comparar</button><div class="zoom" id="zoom"><button id="zout">−</button><button id="zv">100%</button><button id="zin">+</button></div>
 </div>
 <section class="panel">
  <div class="tabs" id="tabs"></div>
  <div class="body" id="body"></div>
 </section>
</main>
<div class="modal" id="modal">
 <img id="mimg" alt="Foto exportada">
 <div>Toque e segure a imagem para salvar, ou use o botão.</div>
 <div style="display:flex;gap:10px"><a class="pri" id="mdl" href="#">Baixar</a><button class="ib" id="mx">Fechar</button></div>
</div>
<div class="toast" id="toast"></div>
<input type="file" id="file" accept="image/*" hidden>
<script>
window.addEventListener('error',e=>{try{toast('Erro: '+(e.message||e))}catch(_){}});
window.addEventListener('unhandledrejection',e=>{try{toast('Erro: '+((e.reason&&e.reason.message)||e.reason))}catch(_){}});
const $=q=>document.querySelector(q);
const ADJ=['exp','bri','con','hil','sha','sat','vib','tem','tin','fade','vig','gra','shp','bw','sep','hue','blur','pix','pb','pw','gam','gr','gg','gb','sts','his','bal','cla','dz','soft','glow','chr'];
const DEF={exp:0,bri:0,con:0,hil:0,sha:0,sat:0,vib:0,tem:0,tin:0,fade:0,vig:0,gra:0,shp:0,bw:0,sep:0,hue:0,blur:0,pix:0,pb:0,pw:0,gam:0,gr:0,gg:0,gb:0,sth:200,sts:0,hih:35,his:0,bal:0,cla:0,dz:0,soft:0,glow:0,chr:0,cz:100,cx:0,cy:0,rot:0,ang:0,fh:0,fv:0,crop:'',text:'',tfont:'system-ui',tsize:8,tcolor:'#ffffff',tx:50,ty:85,bor:0,bcol:'#ffffff'};
const POS=['fade','vig','gra','shp','bw','sep','bor','blur','pix','pb','pw','sts','his','soft','glow','chr'];
const G={Luz:[['exp','Exposição'],['bri','Brilho'],['con','Contraste'],['hil','Realces'],['sha','Sombras']],
Cor:[['sat','Saturação'],['vib','Vibração'],['tem','Temperatura'],['tin','Matiz (verde/magenta)'],['hue','Tom (girar cores)']],
Efeitos:[['fade','Esmaecer'],['vig','Vinheta'],['gra','Granulação'],['shp','Nitidez'],['bw','Preto e branco'],['sep','Sépia'],['blur','Desfoque'],['pix','Pixelizar']]};
const PRE={Original:{},'Vívido':{sat:30,con:15,vib:25},Cinema:{con:20,tem:-15,tin:5,sha:15,vig:30,sat:-10,fade:10},'Teal & Orange':{con:22,sat:18,sth:195,sts:55,hih:28,his:45,vig:25,shp:20,cla:15},Blockbuster:{con:35,sat:10,tem:-10,hil:-25,sha:20,vig:35,shp:30,exp:-5},'Épico':{con:30,sat:20,vib:20,hil:-30,sha:25,shp:35,vig:25,tem:8},Thriller:{con:30,sat:-35,tem:-25,exp:-12,vig:45,gra:15,fade:8},'Filme 35mm':{gra:45,fade:20,tem:12,sat:-8,con:8,vig:20},'Ficção Científica':{tem:-40,tin:-10,con:25,sat:-5,vig:35,exp:-8,shp:20},Western:{sep:35,tem:35,con:20,fade:12,vig:40,gra:25,sat:10},'Anos 80':{tem:-10,tin:25,sat:35,fade:15,con:15,gra:20,bri:5},Vintage:{sep:40,fade:25,vig:35,gra:30,tem:20,con:-5},'P&B':{bw:100,con:20},Noir:{bw:100,con:50,vig:50,exp:-10,gra:20},Quente:{tem:35,sat:10},Frio:{tem:-35,sat:5},'Dramático':{con:40,hil:-30,sha:30,sat:-15,vig:25,shp:30},Suave:{con:-15,fade:20,bri:8,sat:-10},'Pôr do sol':{tem:40,tin:15,sat:25,vig:20},Matte:{fade:35,con:-10,sat:-15},Retrato:{sat:5,vib:15,con:8,sha:12,hil:-10,tem:6,fade:6,shp:12,vig:12},Paisagem:{vib:35,con:18,hil:-20,sha:20,shp:30,sat:12},Comida:{tem:14,sat:25,con:15,vib:20,shp:25,vig:10},Urbano:{con:30,sat:-20,tem:-8,shp:35,vig:20,gra:12},Neon:{sat:55,vib:30,con:25,tin:20,tem:-15,vig:20},Sonho:{bri:10,fade:20,con:-12,sat:15,tem:10,vig:10},'Alto contraste':{con:60,sat:20,shp:40},Pastel:{bri:12,con:-20,sat:-10,fade:25,vib:10,tem:5},Polaroid:{fade:28,tem:15,sat:-5,con:5,vig:30,gra:20,bri:6,tin:6}};
const CL=['Vermelho','Amarelo','Verde','Ciano','Azul','Magenta'];
CL.forEach((c,i)=>{ADJ.push('ms'+i,'ml'+i);DEF['ms'+i]=0;DEF['ml'+i]=0});
Object.assign(G,{'Níveis':[['pb','Ponto preto'],['pw','Ponto branco'],['gam','Gama (meios-tons)'],['gr','Canal vermelho'],['gg','Canal verde'],['gb','Canal azul']],HSL:[...CL.map((c,i)=>['ms'+i,'Saturação · '+c]),...CL.map((c,i)=>['ml'+i,'Luminosidade · '+c])],Tons:[['sth','Sombras · matiz'],['sts','Sombras · intensidade'],['hih','Realces · matiz'],['his','Realces · intensidade'],['bal','Equilíbrio']],Retoque:[['cla','Clareza'],['dz','Remover névoa'],['soft','Suavizar pele'],['glow','Brilho suave'],['chr','Aberração cromática']]});
const RNG={sth:[0,360],hih:[0,360]},mm=k=>RNG[k]||(POS.includes(k)?[0,100]:[-100,100]);
let s={...DEF},src=null,hist=[],hi=-1,orig=false,pend=0;

function rng(k,l,min,max){return `<div class="row"><label><span>${l}</span><output id="o_${k}">0</output></label><input type="range" data-k="${k}" min="${min}" max="${max}" value="0" step="1"></div>`}
function build(){
 const pages={};
 for(const g in G)pages[g]=G[g].map(([k,l])=>rng(k,l,...mm(k))).join('');
 pages.Luz='<button class="chip" id="auto" style="width:100%;margin-top:8px">Melhoria automática</button>'+pages.Luz;
 pages.Filtros='<div class="flt" id="flt"></div><div class="row"><label><span>Intensidade do filtro</span><output id="o_fi">100</output></label><input type="range" id="fi" min="0" max="100" value="100"></div><div class="row" style="margin-top:18px"><label><span>Meus estilos</span></label><input type="text" id="cn" placeholder="Nome do estilo"></div><button class="chip" id="cs" style="width:100%">Salvar ajustes atuais como estilo</button><div class="flt" id="mine"></div>';
 pages.Cortar=`<div class="chips" id="crops">${['','1:1','4:5','4:3','3:2','16:9','9:16'].map(c=>`<button class="chip" data-c="${c}">${c||'Livre'}</button>`).join('')}</div>
 <div class="chips"><button class="chip" id="rl">⟲ 90°</button><button class="chip" id="rr">⟳ 90°</button><button class="chip" id="fh">⇋ Espelhar</button><button class="chip" id="fv">⇅ Inverter</button></div>${rng('ang','Endireitar (°)',-45,45)}${rng('cz','Zoom do recorte (%)',100,400)}${rng('cx','Mover recorte ←→',-100,100)}${rng('cy','Mover recorte ↑↓',-100,100)}`;
 pages.Texto=`<div class="row"><input type="text" data-k="text" placeholder="Digite um texto na foto"></div><div class="row"><select data-k="tfont"><option value="system-ui">Moderna</option><option value="Georgia,serif">Elegante</option><option value="Impact,sans-serif">Impacto</option><option value="Courier New,monospace">Máquina de escrever</option><option value="Brush Script MT,cursive">Manuscrita</option></select></div>${rng('tsize','Tamanho',2,30)}${rng('tx','Posição horizontal',0,100)}${rng('ty','Posição vertical',0,100)}<div class="row"><label><span>Cor do texto</span></label><input type="color" data-k="tcolor" value="#ffffff"></div>
 <div style="height:8px"></div>${rng('bor','Moldura',0,12)}<div class="row"><label><span>Cor da moldura</span></label><input type="color" data-k="bcol" value="#ffffff"></div>`;
 pages.Exportar=`<div class="row"><label><span>Formato</span></label><select id="fmt"><option value="image/jpeg">JPEG</option><option value="image/png">PNG (sem perdas)</option><option value="image/webp">WebP</option></select></div>
 <div class="row"><label><span>Tamanho</span></label><select id="esz"><option value="4096">Máximo (4096 px)</option><option value="2048" selected>Grande (2048 px)</option><option value="1080">Redes sociais (1080 px)</option></select></div><div class="row"><label><span>Qualidade</span><output id="o_q">92</output></label><input type="range" id="qual" min="40" max="100" value="92"></div><button class="pri" id="sv" style="width:100%;margin-top:8px">Salvar na galeria</button><button class="chip" id="exp" style="width:100%;margin-top:10px">Compartilhar / exportar arquivo</button><p class="credit">KADYSEED • desenvolvido por Josimar</p>`;
 let t='',b='';
 Object.keys(pages).forEach((n,i)=>{t+=`<button class="tab${i?'':' on'}" data-t="${n}">${n}</button>`;b+=`<div class="pg${i?'':' on'}" id="pg_${n}">${pages[n]}</div>`});
 $('#tabs').innerHTML=t;$('#body').innerHTML=b;
 $('#tabs').onclick=e=>{const tb=e.target.closest('.tab');if(!tb)return;const n=tb.dataset.t;document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on',x===tb));document.querySelectorAll('.pg').forEach(x=>x.classList.toggle('on',x.id==='pg_'+n))};
 document.querySelectorAll('[data-k]').forEach(el=>{
  el.addEventListener('input',()=>{const k=el.dataset.k;s[k]=el.type==='range'?+el.value:el.value;const o=$('#o_'+k);if(o)o.textContent=el.value;draw()});
  el.addEventListener('change',commit);
  if(el.type==='range')el.addEventListener('dblclick',()=>{el.value=DEF[el.dataset.k];el.dispatchEvent(new Event('input'));commit()});
 });
 $('#qual').oninput=e=>$('#o_q').textContent=e.target.value;
 $('#crops').onclick=e=>{const c=e.target.dataset.c;if(c===undefined)return;s.crop=c;sync();draw();commit()};
 $('#rl').onclick=()=>{s.rot=(s.rot+3)%4;draw();commit()};
 $('#rr').onclick=()=>{s.rot=(s.rot+1)%4;draw();commit()};
 $('#fh').onclick=()=>{s.fh^=1;draw();commit()};
 $('#fv').onclick=()=>{s.fv^=1;draw();commit()};
 $('#exp').onclick=exportAny;$('#auto').onclick=autoFix;$('#cs').onclick=saveMine;$('#sv').onclick=()=>saveGallery();
 let cur='Original';
 $('#fi').oninput=e=>{$('#o_fi').textContent=e.target.value;applyPre(cur,e.target.value/100,false)};
 $('#fi').onchange=commit;
 window.applyPre=(n,f,c=true)=>{cur=n;ADJ.concat(['sth','hih']).forEach(k=>s[k]=(k=='sth'||k=='hih')?(PRE[n][k]==null?DEF[k]:PRE[n][k]):Math.round((PRE[n][k]||0)*f));sync();draw();if(c)commit();document.querySelectorAll('#flt button').forEach(x=>x.classList.toggle('on',x.dataset.n===n))};
}
function sync(){
 document.querySelectorAll('[data-k]').forEach(el=>{const k=el.dataset.k;el.value=s[k];const o=$('#o_'+k);if(o)o.textContent=s[k]});
 document.querySelectorAll('#crops .chip').forEach(c=>c.classList.toggle('on',c.dataset.c===s.crop));
}
function commit(){
 hist=hist.slice(0,hi+1);const j=JSON.stringify(s);if(hist[hi]===j)return;hist.push(j);hi++;btns();
}
function btns(){$('#undo').disabled=hi<1;$('#redo').disabled=hi>=hist.length-1;$('#reset').disabled=!src}
function go(i){hi=i;s=JSON.parse(hist[hi]);sync();draw();btns()}
$('#undo').onclick=()=>hi>0&&go(hi-1);
$('#redo').onclick=()=>hi<hist.length-1&&go(hi+1);
$('#reset').onclick=()=>{s={...DEF};sync();draw();commit()};
document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key==='z'){e.preventDefault();e.shiftKey?$('#redo').click():$('#undo').click()}});

function render(sc,max,st){
 const q=st.rot%2;let w0=q?sc.height:sc.width,h0=q?sc.width:sc.height;
 const k=Math.min(1,max/Math.max(w0,h0)),w=Math.round(w0*k),h=Math.round(h0*k);
 let c=document.createElement('canvas');c.width=w;c.height=h;let x=c.getContext('2d');
 const a=st.ang*Math.PI/180,z=Math.abs(Math.cos(a))+Math.abs(Math.sin(a))*Math.max(w/h,h/w);
 x.imageSmoothingQuality='high';x.translate(w/2,h/2);x.rotate(a);x.scale(z*(st.fh?-1:1),z*(st.fv?-1:1));x.rotate(st.rot*Math.PI/2);
 const dw=sc.width*k,dh=sc.height*k;x.drawImage(sc,-dw/2,-dh/2,dw,dh);
 if(st.crop||st.cz>100){const[r1,r2]=(st.crop||w+':'+h).split(':').map(Number),R=r1/r2,zz=Math.max(1,st.cz/100);let cw=w,ch=h;if(w/h>R)cw=h*R;else ch=w/R;cw=Math.round(cw/zz);ch=Math.round(ch/zz);

function autoFix(){if(!src)return;const t=document.createElement('canvas');t.width=64;t.height=Math.max(1,Math.round(64*src.height/src.width));const x=t.getContext('2d');x.drawImage(src,0,0,t.width,t.height);const d=x.getImageData(0,0,t.width,t.height).data,h=new Array(256).fill(0);let n=0;for(let i=0;i<d.length;i+=4){h[Math.round(.299*d[i]+.587*d[i+1]+.114*d[i+2])]++;n++}
 let a=0,lo=0,hi=255;for(let i=0;i<256;i++){a+=h[i];if(a>=n*.02){lo=i;break}}a=0;for(let i=255;i>=0;i--){a+=h[i];if(a>=n*.02){hi=i;break}}
 const cl=(v,m,M)=>Math.round(Math.max(m,Math.min(M,v)));s.con=cl((255/Math.max(40,hi-lo)-1)*60,0,40);s.bri=cl((128-(lo+hi)/2)*.35,-30,30);s.vib=Math.max(s.vib,18);s.shp=Math.max(s.shp,15);sync();draw();commit();toast('Melhoria automática aplicada')}
let Z=1,PX=0,PY=0,pd=0;const ptr=new Map(),cvE=$('#cv'),stg=$('#stage');
function zapply(){if(Z<=1){PX=PY=0}cvE.style.transform=`translate(${PX}px,${PY}px) scale(${Z})`;$('#zv').textContent=Math.round(Z*100)+'%'}
function zset(z){Z=Math.min(6,Math.max(1,z));zapply()}
$('#zin').onclick=()=>zset(Z*1.4);$('#zout').onclick=()=>zset(Z/1.4);$('#zv').onclick=()=>zset(1);
stg.addEventListener('wheel',e=>{if(!src)return;e.preventDefault();zset(Z*(e.deltaY<0?1.12:.89))},{passive:false});
stg.addEventListener('pointerdown',e=>{if(e.target.closest('button'))return;ptr.set(e.pointerId,[e.clientX,e.clientY]);pd=0});
stg.addEventListener('pointermove',e=>{if(!ptr.has(e.pointerId))return;const o=ptr.get(e.pointerId);ptr.set(e.pointerId,[e.clientX,e.clientY]);
 if(ptr.size===2){const[a,b]=[...ptr.values()],d=Math.hypot(a[0]-b[0],a[1]-b[1]);if(pd)zset(Z*d/pd);pd=d}else if(Z>1){PX+=e.clientX-o[0];PY+=e.clientY-o[1];zapply()}});
['pointerup','pointercancel','pointerleave'].forEach(v=>stg.addEventListener(v,e=>{ptr.delete(e.pointerId);pd=0}));
let MY={};try{MY=JSON.parse(localStorage.getItem('ks_my')||'{}')}catch(e){}
function renderMine(){const f=$('#mine');if(!f||!src)return;f.innerHTML='';for(const n in MY){const b=document.createElement('button');b.appendChild(render(src,90,{...DEF,...MY[n],crop:'1:1'}));b.append(n);b.onclick=()=>{ADJ.forEach(k=>s[k]=MY[n][k]||0);['sth','hih'].forEach(k=>s[k]=MY[n][k]==null?DEF[k]:MY[n][k]);sync();draw();commit()};f.appendChild(b)}}
function saveMine(){const n=($('#cn').value||'').trim();if(!src||!n)return toast('Abra uma foto e digite um nome para o estilo');const o={};ADJ.concat(['sth','hih']).forEach(k=>{if(s[k]!==DEF[k])o[k]=s[k]});MY[n]=o;try{localStorage.setItem('ks_my',JSON.stringify(MY))}catch(e){}$('#cn').value='';renderMine();toast('Estilo salvo!')}
