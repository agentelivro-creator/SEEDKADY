name: Gerar APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Instalar dependencias
        run: npm install --legacy-peer-deps

      - name: Preparar app web
        run: |
          mkdir -p www
          cp index.html www/index.html

      - name: Criar projeto Android
        run: npx cap add android

      - name: Icone do app
        continue-on-error: true
        run: |
          if [ -f icon.png ]; then
            for d in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
              n=${d%%:*}; s=${d##*:}
              mkdir -p android/app/src/main/res/mipmap-$n
              convert icon.png -resize ${s}x${s} android/app/src/main/res/mipmap-$n/ic_launcher.png
              cp android/app/src/main/res/mipmap-$n/ic_launcher.png android/app/src/main/res/mipmap-$n/ic_launcher_round.png
            done
            rm -rf android/app/src/main/res/mipmap-anydpi-v26
          fi

      - name: Evitar barra de status por cima dos botoes (Android 15+)
        continue-on-error: true
        run: |
          f=android/app/src/main/res/values/styles.xml
          sed -i 's#<item name="windowNoTitle">true</item>#<item name="windowNoTitle">true</item>\n        <item name="android:windowOptOutEdgeToEdgeEnforcement">true</item>#' "$f"

      - name: Sincronizar app web
        run: npx cap sync android

      - name: Compilar APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: KADYSEED-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
