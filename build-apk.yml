name: Gerar APK KADYSEED

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Instalar dependencias
        run: npm install

      - name: Criar projeto Android
        run: npx cap add android

      - name: Gerar icones do app
        run: |
          mkdir -p assets
          cp icon-only.png icon-foreground.png icon-background.png assets/
          npm install --no-save @capacitor/assets@3
          npx capacitor-assets generate --android

      - name: Permissoes de galeria
        run: |
          sed -i 's#</manifest>#<uses-permission android:name="android.permission.READ_MEDIA_IMAGES"/><uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32"/><uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="28"/></manifest>#' android/app/src/main/AndroidManifest.xml

      - name: Sincronizar
        run: npx cap sync android

      - name: Compilar APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Enviar APK
        uses: actions/upload-artifact@v4
        with:
          name: KADYSEED-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
